# Weekly pull requests for outdated or vulnerable dependencies.
# CI runs on each one, so a green Dependabot PR is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A new Vitest major also needs the Analog plugin to support it,
      # so those upgrades are done by hand, not by Dependabot.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    groups:
      # Angular (and the Analog test plugin) must move together.
      angular:
        patterns:
          [
            '@angular/*',
            '@angular-devkit/*',
            '@schematics/angular',
            'angular-eslint',
            '@analogjs/*',
          ]
      nx:
        patterns: ['nx', '@nx/*']
      # @vitest/ui pins the exact vitest version: bump them together.
      vitest:
        patterns: ['vitest', '@vitest/*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
