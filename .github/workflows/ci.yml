name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Sets NX_BASE / NX_HEAD so "affected" only runs what changed.
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check
      - run: npx nx affected -t lint test build typecheck
