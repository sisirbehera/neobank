# Render Blueprint – https://render.com/docs/blueprint-spec
# In Render: New + → Blueprint → pick this repo. You'll be asked for MONGODB_URI.
services:
  - type: web
    # Becomes https://<name>.onrender.com and must be unique on Render,
    # e.g. neobank-<yourname>.
    name: neobank
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # secret – entered in the Render dashboard (Atlas connection string)
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a long random value
      - key: SEED_DEMO_DATA
        value: 'true' # public demo: seeds demo@neobank.dev / Demo@1234 with history
      - key: ADMIN_PASSWORD
        sync: false # secret – without it there is no admin user (admin@neobank.dev)
      - key: MFA_ENCRYPTION_KEY
        generateValue: true # encrypts 2FA secrets in MongoDB – never change it after users enrol
